<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: pet-asset:; connect-src 'self' blob: pet-asset:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose your pet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <p class="brand">Desktop Pet Companion</p>
        <h1>Meet your desk mate</h1>
        <p class="lede">Pick a Gobkit critter, give them a name, and send them to your desktop.</p>
      </header>

      <main class="layout">
        <section class="catalog" aria-label="Pet catalog">
          <div id="pet-list" class="pet-list"></div>
        </section>

        <section class="preview-pane" aria-label="Preview">
          <div class="preview-stage">
            <canvas id="preview"></canvas>
          </div>
          <div class="preview-meta">
            <h2 id="pet-title">Corgi</h2>
            <p id="pet-blurb">Loyal short-legged pup</p>
            <div class="anim-row" id="anim-buttons"></div>
          </div>

          <form id="setup-form" class="setup-form">
            <label>
              Name
              <input id="pet-name" maxlength="32" placeholder="Buddy" autocomplete="off" required />
            </label>
            <label>
              Personality
              <select id="personality"></select>
            </label>
            <button type="submit" class="cta" id="confirm-btn">Bring to desktop</button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
