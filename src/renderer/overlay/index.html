<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: pet-asset:; media-src 'self' blob: pet-asset:; connect-src 'self' blob: pet-asset:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        user-select: none;
        cursor: default;
      }
      #app {
        width: 100%;
        height: 100%;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
      }
      #hit {
        position: absolute;
        inset: 18% 18% 14% 18%;
        border-radius: 50%;
        z-index: 2;
      }
      #name-tag {
        position: absolute;
        left: 50%;
        bottom: 6px;
        transform: translateX(-50%);
        font: 600 11px/1.2 "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
        white-space: nowrap;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body.show-name #name-tag {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hit" title="Pet"></div>
      <div id="name-tag"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
